apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-reader
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-pod-reader
  namespace: observability
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-pod-reader
  namespace: observability
subjects:
  - kind: ServiceAccount
    name: lab-reader
    namespace: observability
roleRef:
  kind: Role
  name: lab-pod-reader
  apiGroup: rbac.authorization.k8s.io
