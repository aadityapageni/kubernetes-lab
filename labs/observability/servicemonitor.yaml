apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shop-apps
  namespace: observability
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [observability]
  selector:
    matchLabels:
      monitoring: enabled
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
